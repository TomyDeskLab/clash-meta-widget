name: Build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Build and run checks
        run: bash build.sh
      - name: Verify universal binaries
        run: |
          lipo "build/native/Build/Products/Release/Clash Meta Switch.app/Contents/MacOS/Clash Meta Switch" -verify_arch arm64 x86_64
          lipo "build/native/Build/Products/Release/Clash Meta Switch.app/Contents/PlugIns/MetaSwitch.appex/Contents/MacOS/MetaSwitch" -verify_arch arm64 x86_64
